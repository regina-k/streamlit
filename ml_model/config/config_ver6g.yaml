project:
  name: apartment_return_lightgbm_ver6g_12m_stability_train_test_9_1
  random_state: 42

paths:
  data_path: "C:/Users/User/Desktop/final/streamlit/data/integration/apartment_12m_ver6f_stability_features.csv"
  output_dir: "C:/Users/User/Desktop/final/streamlit/ml_model/outputs"
  model_dir: "C:/Users/User/Desktop/final/streamlit/ml_model/outputs/models"
  prediction_dir: "C:/Users/User/Desktop/final/streamlit/ml_model/outputs/predictions"

data:
  date_column: date
  target_column: target_return_pct
  id_columns: [apt_size_id, complex_id, area_serial_no, date, yyyymm, horizon_months, future_date]
  active_feature_sets: [price_market, apartment_meta, poi_accessibility, individual_stability]
  feature_sets:
    price_market:
      - kb_sale_price_manwon
      - kb_jeonse_price_manwon
      - kb_jeonse_ratio_pct
      - kb_price_gap_manwon
      - actual_sale_avg_manwon
      - actual_jeonse_avg_manwon
      - actual_jeonse_ratio_pct
      - actual_sale_count
      - actual_jeonse_count
      - actual_monthly_rent_count
    apartment_meta:
      - gu
      - lat
      - lon
      - households_total
      - built_yyyymm
      - property_type
      - supply_area_pyeong
      - exclusive_area_pyeong
      - contract_area_pyeong
      - supply_area_m2
      - exclusive_area_m2
      - housing_type
      - households_by_size
      - floor_area_ratio
      - building_coverage_ratio
    poi_accessibility:
      - nearest_station_m
      - station_count_500m
      - station_count_1000m
      - nearest_school_m
      - school_count_1000m
      - nearest_elementary_school_m
      - elementary_school_count_1000m
      - nearest_middle_school_m
      - middle_school_count_1000m
      - nearest_high_school_m
      - high_school_count_1000m
      - nearest_hospital_m
      - hospital_count_3000m
      - hospital_count_5000m
      - hospital_doctor_sum_3000m
      - hospital_doctor_sum_5000m
      - nearest_tertiary_hospital_m
      - tertiary_hospital_count_5000m
    individual_stability:
      - built_year
      - built_month
      - building_age_years
      - size_household_share
      - log_households_total
      - log_households_by_size
      - log_kb_sale_price
      - sale_price_per_exclusive_pyeong
      - jeonse_price_per_exclusive_pyeong
      - sale_price_per_supply_pyeong
      - actual_sale_available
      - actual_jeonse_available
      - actual_sale_to_kb_gap_pct
      - actual_jeonse_to_kb_gap_pct
      - total_tx_count
      - sale_tx_share
      - jeonse_tx_share
      - sale_count_sum_3m
      - jeonse_count_sum_3m
      - total_tx_count_sum_3m
      - sale_count_sum_6m
      - jeonse_count_sum_6m
      - total_tx_count_sum_6m
      - sale_count_sum_12m
      - jeonse_count_sum_12m
      - total_tx_count_sum_12m
      - complex_size_count
      - complex_sale_price_premium_pct
      - complex_pp_premium_pct
      - complex_area_rank_pct
      - complex_price_rank_pct
      - gu_pp_premium_pct
      - gu_price_rank_pct
  categorical_columns: [gu, property_type, housing_type]
  drop_missing_target: true

split:
  strategy: time_train_test_ratio
  train_ratio: 0.9
  test_ratio: 0.1

model:
  type: lightgbm
  params:
    objective: regression
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_samples: 50
    reg_alpha: 0.0
    reg_lambda: 1.0
    n_jobs: -1

metrics:
  primary: mae
  enabled: [mae, rmse, r2, mape, spearman]

