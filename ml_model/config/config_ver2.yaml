project:
  name: apartment_return_lightgbm_ver2_multihorizon
  random_state: 42

paths:
  data_path: "C:/Users/User/Desktop/final/data/apartment/preprocessed/apartment_multihorizon.csv"
  output_dir: "C:/Users/User/Desktop/final/streamlit/ml_model/outputs"
  model_dir: "C:/Users/User/Desktop/final/streamlit/ml_model/outputs/models"
  prediction_dir: "C:/Users/User/Desktop/final/streamlit/ml_model/outputs/predictions"

data:
  date_column: date
  target_column: target_return_pct
  id_columns:
    - apt_size_id
    - complex_id
    - area_serial_no
    - date
    - yyyymm
    - horizon_months
    - future_date
  feature_columns:
    - horizon_months
    - kb_sale_price_manwon
    - kb_jeonse_price_manwon
    - kb_jeonse_ratio_pct
    - kb_price_gap_manwon
    - actual_sale_avg_manwon
    - actual_jeonse_avg_manwon
    - actual_jeonse_ratio_pct
    - actual_sale_count
    - actual_jeonse_count
    - actual_monthly_rent_count
    - gu
    - lat
    - lon
    - households_total
    - built_yyyymm
    - property_type
    - supply_area_pyeong
    - exclusive_area_pyeong
    - contract_area_pyeong
    - supply_area_m2
    - exclusive_area_m2
    - housing_type
    - households_by_size
    - floor_area_ratio
    - building_coverage_ratio
  categorical_columns:
    - gu
    - property_type
    - housing_type
  drop_missing_target: true
  sample_frac:
  max_rows:

split:
  strategy: time_ratio
  train_ratio: 0.7
  valid_ratio: 0.2
  test_ratio: 0.1

model:
  type: lightgbm
  params:
    objective: regression
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_samples: 50
    reg_alpha: 0.0
    reg_lambda: 1.0
    n_jobs: -1

metrics:
  primary: mae
  enabled:
    - mae
    - rmse
    - r2
    - mape
    - spearman
